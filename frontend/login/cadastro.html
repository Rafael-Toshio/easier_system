<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EASIER – Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C89B3C;
      --gold-dark: #A67C28;
      --black: #0A0A0A;
      --white: #F5F5F0;
      --gray: #888;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .split {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* ── SPLASH ───────────────────────────────────── */
    .splash {
      flex: 0 0 340px;
      background: var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 40px,
        rgba(0,0,0,0.04) 40px, rgba(0,0,0,0.04) 41px
      );
    }

    .splash-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .arrows { font-size: 56px; font-family: 'Bebas Neue', sans-serif; color: var(--black); letter-spacing: -4px; line-height: 1; }
    .brand  { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: var(--black); letter-spacing: 8px; }
    .tagline { font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.5); letter-spacing: 3px; text-transform: uppercase; margin-top: -8px; }

    /* ── FORM SIDE ────────────────────────────────── */
    .form-side {
      flex: 1;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 80px;
      overflow-y: auto;
    }

    .form-header {
      width: 100%;
      max-width: 480px;
      margin-bottom: 32px;
    }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: var(--black);
      letter-spacing: 4px;
      line-height: 1;
    }

    .form-title span { color: var(--gold); }
    .form-sub { font-size: 13px; color: var(--gray); margin-top: 8px; }

    /* ── TABS ─────────────────────────────────────── */
    .tipo-tabs {
      display: flex;
      width: 100%;
      max-width: 480px;
      background: #E8E8E3;
      border-radius: 6px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1; padding: 10px; border: none;
      background: transparent; border-radius: 4px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      color: var(--gray); cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
    }

    .tab-btn.active { background: var(--gold); color: var(--white); }

    /* ── FORM ─────────────────────────────────────── */
    .form {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--black);
    }

    .field input, .field select {
      width: 100%; padding: 13px 14px;
      background: var(--gold); border: none; border-radius: 4px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--black); outline: none; transition: box-shadow 0.2s;
      appearance: none;
    }

    .field input::placeholder { color: rgba(0,0,0,0.4); }
    .field input:focus, .field select:focus { box-shadow: 0 0 0 3px rgba(200,155,60,0.4); }

    .field-password { position: relative; }
    .field-password input { padding-right: 44px; }
    .toggle-senha {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: rgba(0,0,0,0.4);
      font-size: 16px; line-height: 1;
    }

    /* Campo cargo - visível só para funcionário */
    .campo-cargo { display: none; }

    .btn-cadastrar {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 16px;
      background: var(--black);
      color: var(--white);
      border: none; border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }

    .btn-cadastrar:hover { background: #222; }
    .btn-cadastrar:active { transform: scale(0.98); }
    .btn-cadastrar:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      grid-column: 1 / -1;
      font-size: 13px; text-align: center;
      padding: 10px 16px; border-radius: 4px; display: none;
    }
    .msg.erro { background: #fdecea; color: #c0392b; display: block; }
    .msg.ok   { background: #e8f8f0; color: #1e8449; display: block; }

    .login-link {
      grid-column: 1 / -1;
      margin-top: 8px; font-size: 13px; color: var(--gray); text-align: center;
    }

    .login-link a { color: var(--gold-dark); font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .split { flex-direction: column; }
      .splash { flex: 0 0 180px; }
      .form-side { padding: 40px 24px; }
      .form { grid-template-columns: 1fr; }
      .field.full { grid-column: 1; }
    }
  </style>
</head>
<body>

<div class="split">

  <!-- SPLASH -->
  <div class="splash">
    <div class="splash-logo">
      <div class="arrows">&gt;&gt;&gt;</div>
      <div class="brand">EASIER</div>
      <div class="tagline">Sistema de Gestão</div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-side">
    <div class="form-header">
      <div class="form-title">CADASTRO <span>&gt;&gt;&gt;</span></div>
      <p class="form-sub">Crie sua conta para começar</p>
    </div>

    <div class="tipo-tabs">
      <button class="tab-btn active" onclick="setTipo('cliente')">Cliente</button>
      <button class="tab-btn" onclick="setTipo('funcionario')">Funcionário</button>
    </div>

    <form class="form" id="formCadastro" onsubmit="cadastrar(event)">

      <div class="field full">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required />
      </div>

      <div class="field full">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required />
      </div>

      <div class="field">
        <label>CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
      </div>

      <div class="field">
        <label>Telefone</label>
        <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15" />
      </div>

      <div class="field campo-cargo" id="campoCargo">
        <label>Cargo</label>
        <input type="text" id="cargo" placeholder="Ex: Vendedor, Gerente..." />
      </div>

      <div class="field">
        <label>Senha</label>
        <div class="field-password">
          <input type="password" id="senha" placeholder="••••••••" required minlength="6" />
          <button type="button" class="toggle-senha" onclick="toggleSenha('senha')">👁</button>
        </div>
      </div>

      <div class="field">
        <label>Confirmar Senha</label>
        <div class="field-password">
          <input type="password" id="confirmar" placeholder="••••••••" required />
          <button type="button" class="toggle-senha" onclick="toggleSenha('confirmar')">👁</button>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <button type="submit" class="btn-cadastrar" id="btnCadastrar">CADASTRAR</button>

      <div class="login-link">
        Já tem conta? <a href="login.html">Faça login</a>
      </div>

    </form>
  </div>

</div>

<script>
  const API = 'http://localhost:3001/api';
  let tipoAtual = 'cliente';

  function setTipo(tipo) {
    tipoAtual = tipo;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tipo === 'cliente') || (i === 1 && tipo === 'funcionario'));
    });
    document.getElementById('campoCargo').style.display = tipo === 'funcionario' ? 'flex' : 'none';
  }

  function toggleSenha(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function showMsg(texto, tipo) {
    const el = document.getElementById('msg');
    el.textContent = texto;
    el.className = 'msg ' + tipo;
  }

  // Máscaras simples
  document.getElementById('cpf').addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    this.value = v;
  });

  document.getElementById('telefone').addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
    this.value = v;
  });

  async function cadastrar(e) {
    e.preventDefault();
    const btn = document.getElementById('btnCadastrar');

    const senha = document.getElementById('senha').value;
    const confirmar = document.getElementById('confirmar').value;

    if (senha !== confirmar) {
      showMsg('As senhas não coincidem.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'CADASTRANDO...';

    const body = {
      nome: document.getElementById('nome').value,
      email: document.getElementById('email').value,
      senha,
      cpf: document.getElementById('cpf').value || undefined,
      telefone: document.getElementById('telefone').value || undefined,
    };

    if (tipoAtual === 'funcionario') {
      body.cargo = document.getElementById('cargo').value || undefined;
    }

    const endpoint = tipoAtual === 'funcionario' ? '/cadastro/funcionario' : '/cadastro/cliente';

    try {
      const res = await fetch(`${API}${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (res.ok) {
        showMsg('Cadastro realizado! Redirecionando para o login...', 'ok');
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } else {
        showMsg(data.erro || 'Erro ao cadastrar.', 'erro');
      }
    } catch (err) {
      showMsg('Não foi possível conectar ao servidor.', 'erro');
    } finally {
      btn.disabled = false;
      btn.textContent = 'CADASTRAR';
    }
  }
</script>

</body>
</html>
