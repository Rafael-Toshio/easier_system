<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EASIER – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="split">

  <!-- SPLASH -->
  <div class="splash">
    <div class="splash-logo">
      <div class="arrows">&gt;&gt;&gt;</div>
      <div class="brand">EASIER</div>
      <div class="tagline">Sistema de Gestão</div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="login-side">
    <div class="login-header">
      <div class="login-title">LOGIN <span>&gt;&gt;&gt;</span></div>
      <p class="login-sub">Acesse sua conta para continuar</p>
    </div>

    <!-- TABS -->
    <div class="tipo-tabs">
      <button class="tab-btn active" onclick="setTipo('cliente')">Cliente</button>
      <button class="tab-btn" onclick="setTipo('funcionario')">Funcionário</button>
    </div>

    <!-- FORM -->
    <form class="form" id="formLogin" onsubmit="fazerLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required />
      </div>

      <div class="field">
        <label>Senha</label>
        <div class="field-password">
          <input type="password" id="senha" placeholder="••••••••" required />
          <button type="button" class="toggle-senha" onclick="toggleSenha()">Mostrar senha</button>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <button type="submit" class="btn-login" id="btnLogin">ENTRAR</button>
    </form>

    <div class="cadastro-link">
      Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
    </div>
  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
